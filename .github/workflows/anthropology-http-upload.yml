name: Native anthropology HTTP POST upload
on:
  push:
    branches:
      - curiosity-upload-pilot-2026-11-07
    paths:
      - 'curiosity-upload/anthropology-http-batch-*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-http-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image validation
        run: python -m pip install --quiet Pillow
      - name: HTTP POST native images with SHA256 round-trip verification
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
            grep -E '^curiosity-upload/anthropology-http-batch-[a-zA-Z0-9_-]+[.]json$' || true
          )
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mapfile -t manifests < <(find curiosity-upload -maxdepth 1 -name 'anthropology-http-batch-*.json' | sort)
          fi
          if (("${#manifests[@]}" == 0)); then
            echo 'No new native HTTP batch manifests.'
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            python curiosity-upload/upload_native_anthropology_http.py "$manifest"
          done
