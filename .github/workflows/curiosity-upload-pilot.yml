name: Curiosity upload pilot
on:
  push:
    branches:
      - curiosity-upload-pilot-2026-11-07
    paths:
      - curiosity-upload/**
      - .github/workflows/curiosity-upload-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curiosity-upload-pilot
  cancel-in-progress: false

jobs:
  test-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out pilot code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Prepare Python environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install SFTP transport
        run: python -m pip install --quiet paramiko
      - name: Fetch and upload selected files
        run: python3 curiosity-upload/uploader.py curiosity-upload/manifest.json
      - name: Upload newly staged generated media into feet collection
        shell: bash
        run: |
          set -euo pipefail
          if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -Fq '.github/workflows/curiosity-upload-pilot.yml'; then
            # Recovery pass: check all staged media after verifying broken redirects.
            mapfile -t files < <(find curiosity-upload/generated-media -maxdepth 1 -type f -name '*.b64' | sort)
          else
            mapfile -t files < <(
              git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
              grep -E '^curiosity-upload/generated-media/[^/]+\.(avif|webp|png|jpg|jpeg|gif)\.b64$' || true
            )
          fi
          for file in "${files[@]}"; do
            filename="${file##*/}"
            filename="${filename%.b64}"
            if [[ "$filename" == "2026-11-07_mossy_garden_lavender_nails.avif" ]]; then
              filename="2026-11-07_mossy_garden_metallic_lavender_nails.avif"
            fi
            python3 curiosity-upload/upload_generated_foot.py "$file" "do androids dream of erotic feet?/$filename"
          done
          echo "Finished processing ${#files[@]} staged generated-media file(s)."

      - name: Upload new convention fundraiser release manifests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
            grep -E '^curiosity-upload/convention-manifest-[A-Za-z0-9_-]+\.json$' || true
          )
          if (("${#manifests[@]}" > 0)); then
            python -m pip install --quiet Pillow
            for manifest in "${manifests[@]}"; do
              python3 curiosity-upload/upload_convention_release.py "$manifest"
            done
          fi
          echo "Processed ${#manifests[@]} new convention release manifest(s)."

      - name: Upload native convention media directly (no fake GIFs)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t media < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
            grep -E '^curiosity-upload/convention-media/[^/]+\.(png|gif)\.b64$' || true
          )
          if (("${#media[@]}" > 0)); then
            python -m pip install --quiet Pillow
            for media_file in "${media[@]}"; do
              python3 curiosity-upload/upload_native_convention.py "$media_file"
            done
          fi
          echo "Processed ${#media[@]} native convention media file(s)."
